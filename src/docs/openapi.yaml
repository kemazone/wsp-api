openapi: 3.0.3
info:
  title: wsp-api
  version: 0.1.0
  description: |
    API REST propia para WhatsApp sobre la **Cloud API de Meta**. Es el único componente que habla con Meta:
    las apps de la plataforma (gestion-app, facturación…) envían mensajes con su API key y reciben los eventos
    (mensajes entrantes, cambios de estado) en la URL que suscriben.

    **Autenticación**
    - Apps cliente: header `X-API-Key` (o `Authorization: Bearer <api key>`).
    - Administración de la plataforma: header `X-Admin-Token` (valor de `ADMIN_TOKEN`).

    **Errores**: `{ "error": "texto" }`. Si el error viene de Meta se agrega `origen: "meta"`, `codigoMeta`, `detalle` y,
    en los envíos, `mensajeId` (el mensaje queda registrado como FALLIDO). Código frecuente: **131047** = pasaron más de 24 h
    desde el último mensaje del cliente: solo se puede enviar una plantilla.

    **Eventos hacia las apps**: `POST` a la URL suscripta con `{ id, evento, empresaId, fecha, datos }` y los headers
    `X-WspApi-Evento`, `X-WspApi-Entrega` y `X-WspApi-Firma: sha256=<HMAC-SHA256(secreto, cuerpo crudo)>`.
    La app debe responder 2xx; si no, se reintenta (30 s, 1, 5, 15 min, 1, 3, 6, 12 h). Eventos: `mensaje.recibido`,
    `mensaje.estado`, `meta.<campo>` (por ejemplo `meta.message_template_status_update`).
servers:
  - url: ../../
    description: Este servidor (relativo a /api/docs/, funciona detrás del prefijo de IIS)
tags:
  - name: Números
  - name: Mensajes
  - name: Contactos
  - name: Media
  - name: Plantillas
  - name: Suscripciones
  - name: Administración
  - name: Webhook Meta
security:
  - ApiKey: []
paths:
  /api/v1/numeros:
    get:
      tags: [Números]
      summary: Números de WhatsApp activos de la empresa
      responses:
        '200': { description: Lista, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Numero' } } } } }
  /api/v1/mensajes:
    post:
      tags: [Mensajes]
      summary: Enviar un mensaje
      description: |
        Usa el número predeterminado de la empresa salvo que se indique `numero` (id interno o phoneNumberId).
        Mensajes libres (texto, media, ubicación, interactivo) solo dentro de las 24 h del último mensaje del cliente;
        fuera de esa ventana, usar `plantilla`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvioMensaje' }
            examples:
              texto: { value: { para: '5491123456789', texto: 'Tu pedido está listo', referencia: 'venta:1234' } }
              plantilla: { value: { para: '5491123456789', plantilla: { nombre: 'aviso_pedido', idioma: 'es_AR', parametros: ['Juan', '1234'] } } }
              documento: { value: { para: '5491123456789', tipo: 'documento', media: { url: 'https://ejemplo.com/factura.pdf', nombreArchivo: 'FC-0001-00001234.pdf', pie: 'Tu factura' } } }
              botones:
                value:
                  para: '5491123456789'
                  tipo: interactivo
                  interactivo: { type: button, body: { text: '¿Confirmás el pedido?' }, action: { buttons: [{ type: reply, reply: { id: confirmar, title: 'Sí' } }, { type: reply, reply: { id: cancelar, title: 'No' } }] } }
      responses:
        '201': { description: Aceptado por Meta (estado ACEPTADO), content: { application/json: { schema: { $ref: '#/components/schemas/Mensaje' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '422': { description: Meta rechazó el mensaje, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [Mensajes]
      summary: Listar mensajes (más nuevos primero)
      parameters:
        - { name: contacto, in: query, schema: { type: string }, description: wa_id del contacto }
        - { name: direccion, in: query, schema: { type: string, enum: [SALIENTE, ENTRANTE] } }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/Estado' } }
        - { name: referencia, in: query, schema: { type: string } }
        - { name: numero, in: query, schema: { type: string } }
        - { name: desde, in: query, schema: { type: string, format: date-time } }
        - { name: hasta, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/limite' }
        - { $ref: '#/components/parameters/pagina' }
      responses:
        '200': { description: Página, content: { application/json: { schema: { $ref: '#/components/schemas/PaginaMensajes' } } } }
  /api/v1/mensajes/{id}:
    get:
      tags: [Mensajes]
      summary: Un mensaje, con el contenido y el historial de estados
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Mensaje, content: { application/json: { schema: { $ref: '#/components/schemas/Mensaje' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/mensajes/{id}/leido:
    post:
      tags: [Mensajes]
      summary: Marcar como leído un mensaje recibido
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: OK } }
  /api/v1/contactos:
    get:
      tags: [Contactos]
      summary: Contactos (con la ventana de 24 h abierta o cerrada)
      parameters:
        - { name: buscar, in: query, schema: { type: string } }
        - { name: numero, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/limite' }
        - { $ref: '#/components/parameters/pagina' }
      responses:
        '200': { description: Página, content: { application/json: { schema: { type: object, properties: { total: { type: integer }, datos: { type: array, items: { $ref: '#/components/schemas/Contacto' } } } } } } }
  /api/v1/contactos/{waId}/mensajes:
    get:
      tags: [Contactos]
      summary: Conversación con un contacto
      parameters:
        - { name: waId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/limite' }
        - { $ref: '#/components/parameters/pagina' }
      responses:
        '200': { description: Página, content: { application/json: { schema: { $ref: '#/components/schemas/PaginaMensajes' } } } }
  /api/v1/media:
    post:
      tags: [Media]
      summary: Subir un archivo a Meta para enviarlo después (media.id)
      description: 'El cuerpo es el archivo tal cual, con su Content-Type. Ej.: curl -H "X-API-Key: ..." -H "Content-Type: application/pdf" --data-binary @factura.pdf "https://host/wsp-api/api/v1/media?nombre=factura.pdf"'
      parameters:
        - { name: nombre, in: query, schema: { type: string } }
        - { name: numero, in: query, schema: { type: string } }
      requestBody:
        required: true
        content: { '*/*': { schema: { type: string, format: binary } } }
      responses:
        '201': { description: Subido, content: { application/json: { schema: { type: object, properties: { id: { type: string }, numeroId: { type: integer }, tipo: { type: string }, bytes: { type: integer } } } } } }
  /api/v1/media/{id}:
    get:
      tags: [Media]
      summary: Descargar un archivo recibido (media.id del evento mensaje.recibido)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: numero, in: query, schema: { type: string } }
      responses:
        '200': { description: El archivo, content: { '*/*': { schema: { type: string, format: binary } } } }
  /api/v1/plantillas:
    get:
      tags: [Plantillas]
      summary: Plantillas de la cuenta de WhatsApp Business (con su estado de aprobación)
      parameters:
        - { name: numero, in: query, schema: { type: string } }
        - { name: limite, in: query, schema: { type: integer, default: 100 } }
        - { name: despues, in: query, schema: { type: string }, description: cursor "siguiente" de la página anterior }
      responses:
        '200': { description: Plantillas }
  /api/v1/suscripciones:
    get:
      tags: [Suscripciones]
      summary: Suscripciones de la empresa
      responses: { '200': { description: Lista } }
    post:
      tags: [Suscripciones]
      summary: Suscribir una URL a eventos
      description: Devuelve el `secreto` una sola vez (si no se manda uno, se genera).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: 'https://kema.from-de.com/ksca-app/api/whatsapp/eventos' }
                eventos: { type: array, items: { type: string }, example: ['mensaje.*'], description: '*, mensaje.recibido, mensaje.estado, mensaje.*, meta.*' }
                descripcion: { type: string }
                secreto: { type: string }
      responses: { '201': { description: Creada } }
  /api/v1/suscripciones/{id}:
    patch:
      tags: [Suscripciones]
      summary: Modificar url, eventos, descripción o activa
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: OK } }
    delete:
      tags: [Suscripciones]
      summary: Desactivar
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: OK } }
  /api/v1/suscripciones/{id}/probar:
    post:
      tags: [Suscripciones]
      summary: Enviar un evento "ping" firmado y ver la respuesta de la app
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: '{ ok, status, texto }' } }
  /api/v1/entregas:
    get:
      tags: [Suscripciones]
      summary: Eventos enviados a las apps (para revisar fallas)
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [PENDIENTE, ENTREGADA, FALLIDA] } }
        - { $ref: '#/components/parameters/limite' }
        - { $ref: '#/components/parameters/pagina' }
      responses: { '200': { description: Página } }
  /api/v1/entregas/{id}/reintentar:
    post:
      tags: [Suscripciones]
      summary: Reintentar una entrega ahora
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: Resultado } }

  /api/admin/empresas:
    get: { tags: [Administración], summary: Empresas, security: [{ AdminToken: [] }], responses: { '200': { description: Lista } } }
    post:
      tags: [Administración]
      summary: Crear empresa
      security: [{ AdminToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nombre], properties: { nombre: { type: string } } } } } }
      responses: { '201': { description: Creada } }
  /api/admin/empresas/{id}:
    patch:
      tags: [Administración]
      summary: Modificar nombre o activa
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: OK } }
  /api/admin/empresas/{id}/api-keys:
    get: { tags: [Administración], summary: API keys de la empresa, security: [{ AdminToken: [] }], parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: Lista } } }
    post:
      tags: [Administración]
      summary: Crear API key (se muestra una sola vez)
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { nombre: { type: string, example: gestion-app PROD } } } } } }
      responses: { '201': { description: Creada } }
  /api/admin/empresas/{id}/api-keys/{keyId}:
    delete:
      tags: [Administración]
      summary: Revocar API key
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }, { name: keyId, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK } }
  /api/admin/empresas/{id}/numeros:
    get: { tags: [Administración], summary: Números de la empresa, security: [{ AdminToken: [] }], parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: Lista } } }
    post:
      tags: [Administración]
      summary: Dar de alta un número de WhatsApp
      description: Guarda el Access Token cifrado y consulta a Meta para validar y completar los datos visibles.
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumberId, wabaId, accessToken]
              properties:
                nombre: { type: string }
                phoneNumberId: { type: string }
                wabaId: { type: string }
                accessToken: { type: string, description: Token permanente de un usuario del sistema }
                predeterminado: { type: boolean }
                verificar: { type: boolean, default: true }
      responses: { '201': { description: Creado } }
  /api/admin/numeros/{id}:
    patch:
      tags: [Administración]
      summary: Modificar número (nombre, wabaId, accessToken, activo, predeterminado)
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: OK } }
  /api/admin/numeros/{id}/verificar:
    get:
      tags: [Administración]
      summary: Revisar el número en Meta y si la cuenta tiene el webhook suscripto
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: Diagnóstico } }
  /api/admin/numeros/{id}/suscribir-webhook:
    post:
      tags: [Administración]
      summary: Suscribir la app de Meta a los webhooks de la cuenta (POST /{waba}/subscribed_apps)
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: OK } }
  /api/admin/numeros/{id}/registrar:
    post:
      tags: [Administración]
      summary: Registrar un número propio en la Cloud API con el PIN de verificación en dos pasos
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [pin], properties: { pin: { type: string, example: '123456' } } } } } }
      responses: { '200': { description: OK } }

  /api/admin/numeros/{id}/probar:
    post:
      tags: [Administración]
      summary: Enviar un mensaje de prueba desde el número (por defecto la plantilla hello_world)
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [para], properties: { para: { type: string }, plantilla: { type: string, default: hello_world }, idioma: { type: string, default: en_US }, texto: { type: string, description: 'Si se indica, manda texto libre (solo dentro de la ventana de 24 h)' } } } } } }
      responses: { '201': { description: Enviado } }

  /api/webhook/meta:
    get:
      tags: [Webhook Meta]
      summary: Verificación de la URL (la hace Meta)
      security: []
      responses: { '200': { description: Devuelve hub.challenge }, '403': { description: Token incorrecto } }
    post:
      tags: [Webhook Meta]
      summary: Eventos de WhatsApp (los envía Meta, firmados con el App Secret)
      security: []
      responses: { '200': { description: Recibido }, '401': { description: Firma inválida } }

components:
  securitySchemes:
    ApiKey: { type: apiKey, in: header, name: X-API-Key }
    AdminToken: { type: apiKey, in: header, name: X-Admin-Token }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: integer } }
    limite: { name: limite, in: query, schema: { type: integer, default: 50, maximum: 200 } }
    pagina: { name: pagina, in: query, schema: { type: integer, default: 1 } }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Estado: { type: string, enum: [PENDIENTE, ACEPTADO, ENVIADO, ENTREGADO, LEIDO, FALLIDO, RECIBIDO] }
    Error:
      type: object
      properties:
        error: { type: string }
        origen: { type: string, example: meta }
        codigoMeta: { type: integer, example: 131047 }
        detalle: { type: string }
        mensajeId: { type: integer }
    Numero:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        phoneNumberId: { type: string }
        wabaId: { type: string }
        numeroVisible: { type: string }
        nombreVerificado: { type: string }
        calidad: { type: string }
        predeterminado: { type: boolean }
    EnvioMensaje:
      type: object
      required: [para]
      properties:
        para: { type: string, description: 'Número con código de país (5491123456789)' }
        tipo: { type: string, enum: [texto, plantilla, imagen, documento, audio, video, sticker, ubicacion, interactivo, reaccion], description: 'Si falta se deduce de texto/plantilla' }
        numero: { type: string, description: 'Número de origen (id o phoneNumberId). Por defecto el predeterminado' }
        texto: { type: string, maxLength: 4096 }
        vistaPrevia: { type: boolean, description: Vista previa de enlaces }
        plantilla:
          type: object
          properties:
            nombre: { type: string }
            idioma: { type: string, default: es_AR }
            parametros: { type: array, items: {}, description: 'Variables del cuerpo {{1}}, {{2}}… (texto u objetos en formato Meta)' }
            encabezado: { description: 'Texto, o { tipo: imagen|documento|video, id|url, nombreArchivo }' }
            botones: { type: array, items: { type: object, properties: { indice: { type: integer }, url: { type: string }, payload: { type: string } } } }
            componentes: { type: array, items: { type: object }, description: 'Alternativa: components en formato Meta' }
        media:
          type: object
          properties:
            id: { type: string, description: Id devuelto por POST /api/v1/media }
            url: { type: string, description: URL pública https }
            pie: { type: string }
            nombreArchivo: { type: string }
        ubicacion: { type: object, properties: { latitud: { type: number }, longitud: { type: number }, nombre: { type: string }, direccion: { type: string } } }
        interactivo: { type: object, description: 'Objeto "interactive" de Meta (button, list, cta_url, flow…)' }
        reaccion: { type: object, properties: { mensajeId: { type: integer }, wamid: { type: string }, emoji: { type: string } } }
        respondeA: { type: string, description: 'Id de mensaje (o wamid) a citar' }
        referencia: { type: string, maxLength: 100, description: 'Id propio de la app (vuelve en los eventos de estado)' }
    Mensaje:
      type: object
      properties:
        id: { type: integer }
        numeroId: { type: integer }
        direccion: { type: string, enum: [SALIENTE, ENTRANTE] }
        wamid: { type: string }
        contacto: { type: object, properties: { waId: { type: string }, nombre: { type: string } } }
        tipo: { type: string }
        texto: { type: string }
        estado: { $ref: '#/components/schemas/Estado' }
        error: { type: object }
        referencia: { type: string }
        respondeA: { type: string }
        fecha: { type: string, format: date-time }
        fechaEstado: { type: string, format: date-time }
        contenido: { type: object }
        estados: { type: array, items: { type: object, properties: { estado: { type: string }, fecha: { type: string, format: date-time }, detalle: { type: object } } } }
    PaginaMensajes:
      type: object
      properties:
        total: { type: integer }
        pagina: { type: integer }
        limite: { type: integer }
        datos: { type: array, items: { $ref: '#/components/schemas/Mensaje' } }
    Contacto:
      type: object
      properties:
        id: { type: integer }
        waId: { type: string }
        nombre: { type: string }
        ultimoEntrante: { type: string, format: date-time }
        ventanaAbierta: { type: boolean, description: 'true = se pueden enviar mensajes libres (no solo plantillas)' }
        ventanaCierra: { type: string, format: date-time }
